<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Venta de fichas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff4d6;
      color: #1c1917;
      font-family: "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0.85rem 2rem 0.7rem;
      background: #14110f;
    }
    .lights {
      height: 14px;
      background:
        radial-gradient(circle, #fff1a8 0 3px, #ffb000 4px 5px, transparent 6px) center / 22px 14px,
        #3a1d0b;
    }
    .brand { color: #fff4d6; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    nav { display: flex; gap: 1.2rem; }
    .tab {
      padding: 0.35rem 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #cbbba4;
      font: inherit;
      cursor: pointer;
    }
    .tab.active { color: #fff4d6; border-bottom-color: #e8a317; font-weight: 700; }
    main { padding: 2rem; }
    h1 { margin: 0 0 1.2rem; color: #d3121a; font-size: 1.8rem; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(12rem, 22rem)); gap: 0.2rem 1.5rem; }
    label { display: block; margin-top: 0.85rem; font-size: 0.85rem; color: #4a3424; }
    input, select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.3rem;
      padding: 0.5rem 0.6rem;
      color: #1c1917;
      background: #fff;
      border: 1px solid #e4c98a;
      border-radius: 8px;
      font: inherit;
    }
    .actions { display: flex; gap: 0.5rem; grid-column: 1 / -1; margin-top: 1.1rem; }
    button.primary, button.ghost {
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: #d3121a; border: 1px solid #d3121a; color: #fff6df; }
    button.ghost { background: transparent; border: 1px solid transparent; color: #7a5c45; }
    #message, #m-message { min-height: 1.2rem; margin: 0.8rem 0 0; color: #d3121a; }
    .slip {
      max-width: 28rem;
      margin-top: 1.4rem;
      padding: 0.2rem 0 0;
      border-top: 1px solid #e0b45a;
    }
    .slip h2 { margin: 0 0 0.6rem; color: #d3121a; font-size: 0.95rem; }
    dl { margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.25rem 0; }
    dt { color: #7a5c45; }
    dd { margin: 0; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Caja</span>
    <nav>
      <button type="button" class="tab active" data-panel="sale">Venta de fichas</button>
      <button type="button" class="tab" data-panel="membership">Membresía</button>
    </nav>
  </header>
  <div class="lights"></div>
  <main>
      <section id="sale">
        <h1>Venta de fichas</h1>
        <form id="sale-form" class="fields">
          <label>Usuario <input id="user" value="cashier" required></label>
          <label>Cliente <select id="customer" required></select></label>
          <label>Artículo <select id="item" required></select></label>
          <label>Cantidad <input id="quantity" type="number" min="1" value="2" required></label>
          <label>Método de pago
            <select id="payment">
              <option value="cash">Efectivo</option>
              <option value="card">Tarjeta</option>
            </select>
          </label>
          <div class="actions">
            <button type="button" id="preview" class="primary">Ver resumen</button>
          </div>
        </form>
        <p id="message"></p>
        <div id="summary" class="slip" hidden>
          <h2>Resumen</h2>
          <dl>
            <div><dt>Cliente</dt><dd id="q-customer"></dd></div>
            <div><dt>Detalle</dt><dd id="q-detail"></dd></div>
            <div><dt>Monto</dt><dd id="q-amount"></dd></div>
            <div><dt>Pago</dt><dd id="q-method"></dd></div>
            <div><dt>Usuario</dt><dd id="q-user"></dd></div>
          </dl>
          <div class="actions">
            <button type="button" id="confirm" class="primary">Confirmar</button>
            <button type="button" id="clear" class="ghost">Cancelar</button>
          </div>
        </div>
        <div id="receipt" class="slip" hidden>
          <h2>Comprobante <span id="r-number"></span></h2>
          <dl>
            <div><dt>Fecha</dt><dd id="r-date"></dd></div>
            <div><dt>Cliente</dt><dd id="r-customer"></dd></div>
            <div><dt>Detalle</dt><dd id="r-detail"></dd></div>
            <div><dt>Monto</dt><dd id="r-amount"></dd></div>
            <div><dt>Pago</dt><dd id="r-method"></dd></div>
            <div><dt>Usuario</dt><dd id="r-user"></dd></div>
          </dl>
        </div>
      </section>
      <section id="membership" hidden>
        <h1>Membresía</h1>
        <form id="membership-form" class="fields">
          <label>Usuario <input id="m-user" value="cashier" required></label>
          <label>Cliente <select id="m-customer" required></select></label>
          <label>Tipo de membresía <select id="m-type" required></select></label>
          <label>Método de pago
            <select id="m-payment">
              <option value="cash">Efectivo</option>
              <option value="card">Tarjeta</option>
            </select>
          </label>
          <div class="actions">
            <button type="button" id="m-preview" class="primary">Ver resumen</button>
          </div>
        </form>
        <p id="m-message"></p>
        <div id="m-summary" class="slip" hidden>
          <h2>Resumen</h2>
          <dl>
            <div><dt>Cliente</dt><dd id="mq-customer"></dd></div>
            <div><dt>Tipo</dt><dd id="mq-type"></dd></div>
            <div><dt>Inicio</dt><dd id="mq-start"></dd></div>
            <div><dt>Vencimiento</dt><dd id="mq-expiry"></dd></div>
            <div><dt>Monto</dt><dd id="mq-amount"></dd></div>
            <div><dt>Pago</dt><dd id="mq-method"></dd></div>
            <div><dt>Usuario</dt><dd id="mq-user"></dd></div>
          </dl>
          <div class="actions">
            <button type="button" id="m-confirm" class="primary">Confirmar</button>
            <button type="button" id="m-clear" class="ghost">Cancelar</button>
          </div>
        </div>
        <div id="m-receipt" class="slip" hidden>
          <h2>Comprobante <span id="mr-number"></span></h2>
          <dl>
            <div><dt>Fecha</dt><dd id="mr-date"></dd></div>
            <div><dt>Cliente</dt><dd id="mr-customer"></dd></div>
            <div><dt>Tipo</dt><dd id="mr-type"></dd></div>
            <div><dt>Vigencia</dt><dd id="mr-period"></dd></div>
            <div><dt>Monto</dt><dd id="mr-amount"></dd></div>
            <div><dt>Pago</dt><dd id="mr-method"></dd></div>
            <div><dt>Usuario</dt><dd id="mr-user"></dd></div>
          </dl>
        </div>
      </section>
  </main>
  <script>
    const methods = { cash: "efectivo", card: "tarjeta" };
    const errors = {
      "quantity must be from 1 up to the stock": "La cantidad debe estar entre 1 y la existencia.",
      "customer is not active": "El cliente no está activo.",
      "customer was not found": "El cliente no existe.",
      "item is not sellable": "El artículo no se puede vender.",
      "item was not found": "El artículo no existe.",
      "payment method must be cash or card": "El método de pago debe ser efectivo o tarjeta.",
      "membership type is not active": "El tipo de membresía no está activo.",
      "membership type was not found": "El tipo de membresía no existe.",
      "membership cost cannot be negative": "El costo del tipo no puede ser negativo.",
      "duration must be a whole number of days above zero": "La duración del tipo no es válida.",
      "user is required": "Indique el usuario."
    };
    const message = document.querySelector("#message");
    const summary = document.querySelector("#summary");
    const receipt = document.querySelector("#receipt");

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => {
          item.classList.toggle("active", item === tab);
        });
        document.querySelector("#sale").hidden = tab.dataset.panel !== "sale";
        document.querySelector("#membership").hidden = tab.dataset.panel !== "membership";
      });
    });

    function payload() {
      return {
        customer_id: Number(document.querySelector("#customer").value),
        item_id: Number(document.querySelector("#item").value),
        quantity: Number(document.querySelector("#quantity").value),
        payment_method: document.querySelector("#payment").value,
        user: document.querySelector("#user").value
      };
    }

    async function post(path, data = payload()) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const body = await response.json();
      if (!response.ok) {
        throw new Error(errors[body.detail] || body.detail);
      }
      return body;
    }

    function optionLabel(row, stock) {
      const note = row.active ? "" : " (inactivo)";
      const sale = stock && !row.sellable ? " (no vendible)" : "";
      const units = stock ? `, existencia ${row.stock}, valor ${row.unit_value}` : "";
      return `${row.name}${note}${sale}${units}`;
    }

    function typeLabel(row) {
      const note = row.active ? "" : " (inactivo)";
      return `${row.name}${note}, costo ${row.cost}, ${row.duration_days} días`;
    }

    async function loadCatalog() {
      const catalog = await fetch("/chip-sales/catalog").then((response) => response.json());
      fill("customer", catalog.customers, false);
      fill("item", catalog.items, true);
    }

    function fill(id, rows, stock, label = (row) => optionLabel(row, stock)) {
      const select = document.querySelector("#" + id);
      select.innerHTML = "";
      for (const row of rows) {
        const option = document.createElement("option");
        option.value = row.id;
        option.textContent = label(row);
        select.append(option);
      }
    }

    function text(id, value) {
      document.querySelector(id).textContent = value;
    }

    document.querySelector("#preview").addEventListener("click", async () => {
      receipt.hidden = true;
      try {
        const quoted = await post("/chip-sales/preview");
        summary.hidden = false;
        text("#q-customer", quoted.customer_name);
        text("#q-detail", `${quoted.quantity} ${quoted.item_name}`);
        text("#q-amount", quoted.amount);
        text("#q-method", methods[quoted.payment_method]);
        text("#q-user", quoted.user);
        message.textContent = "";
      } catch (error) {
        summary.hidden = true;
        message.textContent = error.message;
      }
    });

    document.querySelector("#clear").addEventListener("click", () => {
      summary.hidden = true;
      message.textContent = "La venta no se registró.";
    });

    document.querySelector("#confirm").addEventListener("click", async () => {
      try {
        const sold = await post("/chip-sales");
        summary.hidden = true;
        receipt.hidden = false;
        text("#r-number", sold.number);
        text("#r-date", sold.sold_on);
        text("#r-customer", sold.customer_name);
        text("#r-detail", sold.detail);
        text("#r-amount", sold.amount);
        text("#r-method", methods[sold.payment_method]);
        text("#r-user", sold.user);
        message.textContent = "";
        await loadCatalog();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    const mMessage = document.querySelector("#m-message");
    const mSummary = document.querySelector("#m-summary");
    const mReceipt = document.querySelector("#m-receipt");

    function membershipPayload() {
      return {
        customer_id: Number(document.querySelector("#m-customer").value),
        type_id: Number(document.querySelector("#m-type").value),
        payment_method: document.querySelector("#m-payment").value,
        user: document.querySelector("#m-user").value
      };
    }

    async function loadMembershipCatalog() {
      const catalog = await fetch("/memberships/catalog").then((response) => response.json());
      fill("m-customer", catalog.customers, false);
      fill("m-type", catalog.types, false, typeLabel);
    }

    document.querySelector("#m-preview").addEventListener("click", async () => {
      mReceipt.hidden = true;
      try {
        const quoted = await post("/memberships/preview", membershipPayload());
        mSummary.hidden = false;
        text("#mq-customer", quoted.customer_name);
        text("#mq-type", quoted.type_name);
        text("#mq-start", quoted.starts_on);
        text("#mq-expiry", quoted.expires_on);
        text("#mq-amount", quoted.amount);
        text("#mq-method", methods[quoted.payment_method]);
        text("#mq-user", quoted.user);
        mMessage.textContent = "";
      } catch (error) {
        mSummary.hidden = true;
        mMessage.textContent = error.message;
      }
    });

    document.querySelector("#m-clear").addEventListener("click", () => {
      mSummary.hidden = true;
      mMessage.textContent = "La membresía no se registró.";
    });

    document.querySelector("#m-confirm").addEventListener("click", async () => {
      try {
        const assigned = await post("/memberships", membershipPayload());
        mSummary.hidden = true;
        mReceipt.hidden = false;
        text("#mr-number", assigned.number);
        text("#mr-date", assigned.issued_on);
        text("#mr-customer", assigned.customer_name);
        text("#mr-type", assigned.type_name);
        text("#mr-period", `${assigned.starts_on} a ${assigned.expires_on}`);
        text("#mr-amount", assigned.amount);
        text("#mr-method", methods[assigned.payment_method]);
        text("#mr-user", assigned.user);
        mMessage.textContent = "";
      } catch (error) {
        mMessage.textContent = error.message;
      }
    });

    loadCatalog();
    loadMembershipCatalog();
  </script>
</body>
</html>
